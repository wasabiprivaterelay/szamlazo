# Local development only: a Postgres for `npm run dev` and `npm test`.
#   docker compose up -d
# Production uses deploy/compose.yml (docs/production.md).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: szamlazo
      POSTGRES_PASSWORD: szamlazo
      POSTGRES_DB: szamlazo
    # Bound to this machine only, never to the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U szamlazo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
