<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Számlák</title>
<style nonce="__NONCE__">
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --sunk: #f8f9fa;
  --ink: #16202a;
  --muted: #5b6672;
  --faint: #8b949e;
  --line: #e1e5ea;
  --line-strong: #c9d0d8;
  --accent: #155e66;
  --accent-ink: #ffffff;
  --accent-soft: #e3f0f1;
  --ok: #1d7348;
  --ok-soft: #e2f3ea;
  --warn: #8a5a00;
  --warn-soft: #fbf0d9;
  --err: #b42318;
  --err-soft: #fde8e6;
  --focus: #2f7f88;
  --shadow: 0 1px 2px rgba(22, 32, 42, .06), 0 4px 16px rgba(22, 32, 42, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161b;
    --surface: #181f26;
    --sunk: #141a20;
    --ink: #e6eaee;
    --muted: #a0aab4;
    --faint: #75808b;
    --line: #27313b;
    --line-strong: #36424e;
    --accent: #5fb3bb;
    --accent-ink: #0d1a1c;
    --accent-soft: #19343a;
    --ok: #63c08f;
    --ok-soft: #173326;
    --warn: #e2b04a;
    --warn-soft: #3a2f16;
    --err: #f2867a;
    --err-soft: #3d1f1c;
    --focus: #7cc6cd;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* Top bar */
.top {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1180px; margin: 0 auto;
  padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 600; }
.mark { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); position: relative; flex: none; }
.mark::before, .mark::after { content: ""; position: absolute; left: 7px; height: 3px; background: var(--accent-ink); border-radius: 1px; }
.mark::before { top: 6px; width: 10px; }
.mark::after { top: 12px; width: 6px; }
.top .sp { flex: 1; }
.who { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.envbadge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); }

main { max-width: 1180px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right)) 64px max(16px, env(safe-area-inset-left)); }
h1 { font-size: 24px; line-height: 1.25; margin: 0; font-weight: 650; text-wrap: balance; }
h2 { font-size: 15px; margin: 0 0 12px; font-weight: 650; }
.head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.head .sp { flex: 1; }
.sub { color: var(--muted); font-size: 14px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 0 14px; border-radius: 8px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 550; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--err); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--sunk); }
.btn.small { min-height: 30px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.card.pad { padding: 20px; }
.card + .card { margin-top: 16px; }

/* Invoice list */
.toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.search {
  flex: 1; min-width: 200px; max-width: 360px; height: 38px; padding: 0 12px;
  border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface);
}
.tablewrap { overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; }
table.list th {
  text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted);
  padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.list td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.list tr:last-child td { border-bottom: 0; }
table.list tbody tr { cursor: pointer; }
table.list tbody tr:hover td { background: var(--sunk); }
table.list .r { text-align: right; }
.inv-no { font-weight: 600; white-space: nowrap; }
.buyer-cell { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); }
.empty p { margin: 0 0 16px; }
.more { display: flex; justify-content: center; padding: 14px; border-top: 1px solid var(--line); }

/* Status chips */
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px;
  font-size: 12.5px; font-weight: 550; white-space: nowrap; background: var(--sunk); color: var(--muted);
}
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.err { background: var(--err-soft); color: var(--err); }
.chip.busy::before { animation: pulse 1.2s ease-in-out infinite; }
.chip.plain::before { display: none; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .chip.busy::before { animation: none; } }

/* Form */
.formgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.side { position: sticky; top: 76px; }
.section { padding: 20px; }
.section + .section { border-top: 1px solid var(--line); }
.row + .row { margin-top: 12px; }
.row { display: grid; gap: 12px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.f { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.f label, .lbl { font-size: 13px; font-weight: 550; color: var(--muted); }
.f input, .f select, .f textarea, .cell input, .cell select {
  width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--line-strong);
  border-radius: 8px; background: var(--surface);
}
.f textarea { height: auto; min-height: 64px; padding: 8px 10px; resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus, .cell input:focus, .cell select:focus, .search:focus {
  outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px var(--accent-soft);
}
.f.bad input, .f.bad select, .cell.bad input { border-color: var(--err); }
.fmsg { font-size: 12.5px; color: var(--err); }
.hint { font-size: 12.5px; color: var(--faint); }
.s1 { grid-column: span 1; } .s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s6 { grid-column: span 6; }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--sunk); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 550; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.inline { display: flex; gap: 8px; align-items: end; }
.inline .f { flex: 1; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }

/* Lines */
.lines { width: 100%; border-collapse: collapse; }
.lines th { font-size: 12.5px; font-weight: 600; color: var(--muted); text-align: left; padding: 0 6px 6px; white-space: nowrap; }
.lines td { padding: 4px 6px; vertical-align: top; }
.lines th:first-child, .lines td:first-child { padding-left: 0; }
.lines .r { text-align: right; }
.lines .tot { padding-top: 13px; white-space: nowrap; font-weight: 550; }
.cell input, .cell select { height: 36px; }
.cell.qty { width: 84px; } .cell.unit { width: 84px; } .cell.price { width: 130px; } .cell.vat { width: 96px; }
.cell .sub2 { margin-top: 6px; display: grid; gap: 6px; }
.aam { padding-top: 9px; color: var(--muted); font-size: 13px; }

/* Summary */
.sum-label { font-size: 13px; color: var(--muted); }
.sum-total { font-size: 32px; font-weight: 700; line-height: 1.1; margin: 4px 0 4px; letter-spacing: -.5px; }
.sum-rows { margin: 16px 0; font-size: 13.5px; }
.sum-rows div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
.sum-rows span:first-child { color: var(--muted); }
.stack { display: grid; gap: 8px; }

/* Banners */
.banner { border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px; }
.banner.err { background: var(--err-soft); color: var(--err); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner ul { margin: 6px 0 0; padding-left: 18px; }

/* Detail */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.pdf { width: 100%; height: min(1100px, calc(100vh - 140px)); min-height: 520px; border: 0; border-radius: 12px; background: var(--sunk); display: block; }
.pdfwrap { padding: 0; overflow: hidden; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.status-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.status-line:first-of-type { border-top: 0; padding-top: 0; }
.status-note { font-size: 13px; color: var(--muted); margin: -4px 0 8px; overflow-wrap: anywhere; }
.status-note.err { color: var(--err); }
.big { font-size: 28px; font-weight: 700; letter-spacing: -.4px; margin: 2px 0 14px; }

/* Dialog */
dialog {
  border: 0; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px));
  background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
dialog.wide { width: min(980px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(10, 16, 22, .45); }
.dlg-head { padding: 18px 20px 0; }
.dlg-body { padding: 14px 20px; }
.dlg-foot { padding: 14px 20px 18px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dlg-pdf { width: 100%; height: min(75vh, 900px); border: 0; display: block; background: var(--sunk); }

.toast {
  position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
  box-shadow: var(--shadow); z-index: 50; max-width: calc(100vw - 32px);
}
.loading { color: var(--muted); padding: 40px 0; text-align: center; }

/* Navigation */
.nav { display: flex; gap: 4px; margin-left: 8px; }
.nav a { padding: 6px 10px; border-radius: 7px; color: var(--muted); text-decoration: none; font-weight: 550; font-size: 14px; }
.nav a:hover { color: var(--ink); background: var(--sunk); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--sunk); }

/* Activity log */
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: end; }
.filters .f { min-width: 160px; flex: 0 1 220px; }
table.log { width: 100%; border-collapse: collapse; font-size: 14px; }
table.log th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.log td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.log tr:last-child td { border-bottom: 0; }
.when { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.what { font-weight: 550; white-space: nowrap; }
.what.ok { color: var(--ok); } .what.err { color: var(--err); } .what.warn { color: var(--warn); }
.det { color: var(--muted); overflow-wrap: anywhere; }
.who-cell { white-space: nowrap; }

/* Timeline on an invoice */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 0 14px 18px; font-size: 13.5px; }
.timeline li::before { content: ""; position: absolute; left: 3px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.timeline li::after { content: ""; position: absolute; left: 6px; top: 16px; bottom: 0; width: 1px; background: var(--line); }
.timeline li:last-child { padding-bottom: 0; }
.timeline li:last-child::after { display: none; }
.timeline li.ok::before { background: var(--ok); } .timeline li.err::before { background: var(--err); } .timeline li.warn::before { background: var(--warn); }
.timeline .t-head { display: flex; justify-content: space-between; gap: 8px; }
.timeline .t-what { font-weight: 550; }
.timeline .t-when { color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.timeline .t-det { color: var(--muted); overflow-wrap: anywhere; }
@media (max-width: 640px) {
  .nav { margin-left: 0; }
  #seller-name { display: none; }
  .who-cell { white-space: normal; }
  table.log thead { display: none; }
  table.log, table.log tbody, table.log tr, table.log td { display: block; }
  table.log tr { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  table.log td { padding: 1px 0; border: 0; }
}

@media (max-width: 900px) {
  .formgrid, .detail { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  .pdf { height: 70vh; min-height: 420px; }
}
@media (max-width: 640px) {
  main { padding-top: 16px; }
  .row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .s1, .s2 { grid-column: span 1; } .s3, .s4, .s6 { grid-column: span 2; }
  .who { display: none; }
  table.list .hide-s, table.list thead { display: none; }
  table.list, table.list tbody { display: block; }
  table.list tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "no amt" "buyer amt"; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  table.list tr:last-child { border-bottom: 0; }
  table.list td { padding: 0; border: 0; }
  table.list td.c-no { grid-area: no; }
  table.list td.c-buyer { grid-area: buyer; color: var(--muted); font-size: 14px; max-width: none; }
  table.list td.c-amt { grid-area: amt; align-self: center; font-weight: 600; }
  .lines thead { display: none; }
  .lines, .lines tbody, .lines tr, .lines td { display: block; width: 100%; }
  .lines tr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
  .lines td { padding: 0; }
  .lines td.desc { grid-column: span 2; }
  .cell.qty, .cell.unit, .cell.price, .cell.vat { width: auto; }
  .lines .tot { padding-top: 8px; text-align: left; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/"><span class="mark" aria-hidden="true"></span><span id="seller-name">Számlák</span></a>
    <nav class="nav" aria-label="Fő menü"><a href="#/" data-nav="list">Számlák</a><a href="#/log" data-nav="log">Napló</a></nav>
    <span class="envbadge" id="env-badge" hidden>Tesztrendszer</span>
    <span class="sp"></span>
    <span class="who" id="who"></span>
  </div>
</header>
<main id="main"><div class="loading">Betöltés…</div></main>
<script nonce="__NONCE__">
"use strict";

/* ---------- helpers ---------- */

/** Builds an element. Text is always set as text, never parsed as HTML. */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key === "class") el.className = value;
    else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else if (key === "value") el.value = value;
    else if (key === "checked" || key === "disabled" || key === "selected") el[key] = Boolean(value);
    else el.setAttribute(key, value === true ? "" : String(value));
  }
  for (const child of children.flat(Infinity)) {
    if (child === undefined || child === null || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}

/** Replaces an element's children, skipping the empty ones a conditional leaves. */
function fill(el, ...kids) {
  el.replaceChildren(...kids.flat(Infinity).filter((k) => k !== undefined && k !== null && k !== false && k !== "")
    .map((k) => (k instanceof Node ? k : document.createTextNode(String(k)))));
}

const money = (n) => new Intl.NumberFormat("hu-HU").format(n) + " Ft";
const huDate = (iso) => (iso ? iso.slice(0, 10).replaceAll("-", ".") + "." : "");
const huDateTime = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("hu-HU", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
};
function todayIso() {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Budapest", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  return parts;
}
function addDaysIso(iso, days) {
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
const formatTax = (v) => {
  const d = String(v || "").replace(/\D/g, "");
  return d.length === 11 ? `${d.slice(0, 8)}-${d.slice(8, 9)}-${d.slice(9)}` : v;
};

class ApiError extends Error {
  constructor(status, body) {
    super((body && body.error && body.error.message) || `HTTP ${status}`);
    this.status = status;
    this.code = body && body.error && body.error.code;
    this.details = body && body.error && body.error.details;
  }
}

async function api(path, options = {}) {
  const init = { method: options.method || "GET", headers: {}, credentials: "same-origin" };
  if (init.method !== "GET") init.headers["x-szamlazo-ui"] = "1";
  if (options.body !== undefined) {
    init.headers["content-type"] = "application/json";
    init.body = JSON.stringify(options.body);
  }
  let response;
  try {
    response = await fetch(path, init);
  } catch {
    throw new ApiError(0, { error: { code: "OFFLINE", message: "Nem sikerült elérni a szervert, vagy lejárt a belépés. Töltsd újra az oldalt, és próbáld újra." } });
  }
  // Access sends an expired login to its own page, which fetch cannot follow.
  if (response.type === "opaqueredirect" || response.redirected && !response.url.startsWith(location.origin)) {
    throw new ApiError(401, { error: { code: "LOGIN", message: "Lejárt a belépés. Töltsd újra az oldalt." } });
  }
  if (options.raw && response.ok) return response;
  const body = await response.json().catch(() => undefined);
  if (!response.ok) throw new ApiError(response.status, body);
  return body;
}

let toastTimer;
function toast(text) {
  document.querySelector(".toast")?.remove();
  const el = h("div", { class: "toast", role: "status" }, text);
  document.body.append(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3500);
}

/** A dialog that resolves with the pressed button's value, or undefined when dismissed. */
function ask({ title, body, buttons, wide, onOpen }) {
  return new Promise((resolve) => {
    const dlg = h("dialog", { class: wide ? "wide" : "" });
    const finish = (value) => { dlg.close(); dlg.remove(); resolve(value); };
    dlg.append(
      h("div", { class: "dlg-head" }, h("h2", {}, title)),
      h("div", { class: "dlg-body" }, body),
      h("div", { class: "dlg-foot" }, buttons.map((b) =>
        h("button", { class: "btn " + (b.kind || ""), type: "button", onclick: () => finish(b.value) }, b.label))),
    );
    dlg.addEventListener("cancel", (e) => { e.preventDefault(); finish(undefined); });
    document.body.append(dlg);
    dlg.showModal();
    onOpen && onOpen(dlg);
  });
}

const objectUrls = new Set();
function pdfUrl(blob) {
  const url = URL.createObjectURL(new Blob([blob], { type: "application/pdf" }));
  objectUrls.add(url);
  return url;
}
function releaseUrls() {
  for (const url of objectUrls) URL.revokeObjectURL(url);
  objectUrls.clear();
}

function errorBanner(error) {
  const items = Array.isArray(error.details) ? error.details : [];
  return h("div", { class: "banner err", role: "alert" },
    describeError(error),
    items.length ? h("ul", {}, items.map((d) => h("li", {}, fieldName(d.path), ": ", huMessage(d.path, d.message)))) : null);
}

/** The server's checks speak English; the page says the same in Hungarian. */
function huMessage(path, message) {
  const m = String(message || "");
  if (/too small|expected string|required/i.test(m)) return /quantity/.test(path || "") ? "Legalább 1 legyen." : "Kötelező mező.";
  if (/postcode/i.test(m)) return "Négyjegyű irányítószám kell, pl. 1011.";
  if (/11-digit tax number/i.test(m)) return "A teljes, 11 jegyű adószám kell, pl. 12345678-2-41.";
  if (/company buyer needs its tax number/i.test(m)) return "Céges vevőnél kötelező az adószám.";
  if (/email/i.test(m)) return "Érvénytelen e-mail-cím.";
  if (/control character/i.test(m)) return "Nem engedélyezett karaktert tartalmaz.";
  if (/too big/i.test(m)) return "Túl nagy érték.";
  if (/real date|date like/i.test(m)) return "Érvénytelen dátum.";
  return m;
}

const ERROR_TEXT = {
  TAXPAYER_INVALID: "A NAV szerint ez az adószám nem érvényes, vagy nem ehhez a céghez tartozik.",
  DATE_INVALID: "Hibás dátum.",
  VAT_INVALID: "Az áfa beállítása nem helyes.",
  REFERENCE_CONFLICT: "Ezt a számlát már kiállítottuk korábban. Nézd meg a számlák listájában.",
  INVALID_REQUEST: "Néhány mező hiányzik vagy hibás.",
  NAV_UNAVAILABLE: "A NAV most nem válaszol.",
  NO_MAILER: "Ezen a szerveren nincs beállítva e-mail küldés.",
  ALREADY_STORNO: "Ezt a számlát már sztornóztuk.",
};
function describeError(error) {
  const text = ERROR_TEXT[error.code];
  if (text && error.code !== "INVALID_REQUEST" && error.message && error.code !== "REFERENCE_CONFLICT") return `${text} (${error.message})`;
  return text || error.message;
}
const FIELD_NAMES = {
  "buyer.name": "Vevő neve", "buyer.postcode": "Irányítószám", "buyer.city": "Település", "buyer.address": "Cím",
  "buyer.taxNumber": "Adószám", "buyer.email": "E-mail-cím", fulfilmentDate: "Teljesítés dátuma", dueDate: "Fizetési határidő",
  note: "Megjegyzés", lines: "Tételek",
};
function fieldName(path) {
  if (FIELD_NAMES[path]) return FIELD_NAMES[path];
  const m = /^lines\.(\d+)\.?(\w*)/.exec(path || "");
  if (m) {
    const part = { description: "megnevezés", quantity: "mennyiség", unit: "egység", unitPriceGross: "egységár", vatRate: "áfa", vatExemption: "mentesség" }[m[2]] || "";
    return `${Number(m[1]) + 1}. tétel ${part}`.trim();
  }
  return path || "Kérés";
}

/* ---------- status ---------- */

function navChip(nav, small) {
  const s = nav && nav.status;
  const map = {
    done: ["ok", "NAV: befogadva"],
    warning: ["warn", "NAV: figyelmeztetéssel befogadva"],
    error: ["err", "NAV: elutasítva"],
    queued: ["busy", "NAV: beküldésre vár"],
    pending: ["busy", "NAV: beküldés alatt"],
    sent: ["busy", "NAV: feldolgozás alatt"],
    "not configured": ["plain", "NAV nincs beállítva"],
  };
  const [kind, label] = map[s] || ["", s || "–"];
  const text = small ? label.replace("NAV: ", "") : label;
  return h("span", { class: "chip " + kind }, text.charAt(0).toUpperCase() + text.slice(1));
}
function emailChip(email, manual) {
  if (manual && (!email || !["sent", "delivered"].includes(email.status))) return h("span", { class: "chip ok" }, "Kézzel elküldve");
  if (!email) return h("span", { class: "chip plain" }, "Nincs elküldve");
  const map = {
    sent: ["ok", "Elküldve"], delivered: ["ok", "Kézbesítve"], queued: ["busy", "Küldésre vár"], sending: ["busy", "Küldés alatt"],
    failed: ["err", "Sikertelen"], bounced: ["err", "Visszapattant"],
  };
  const [kind, label] = map[email.status] || ["", email.status];
  return h("span", { class: "chip " + kind }, label);
}
const settled = (inv) => ["done", "warning", "error", "not configured"].includes(inv.nav && inv.nav.status) &&
  (!inv.email || !["queued", "sending"].includes(inv.email.status));

/* ---------- state & routing ---------- */

let me;
let pollTimer;
let leaveGuard;

function route() {
  clearTimeout(pollTimer);
  releaseUrls();
  const hash = location.hash || "#/";
  const [path, query] = hash.slice(1).split("?");
  const params = new URLSearchParams(query || "");
  const main = document.getElementById("main");
  fill(main, h("div", { class: "loading" }, "Betöltés…"));
  window.scrollTo(0, 0);
  for (const link of document.querySelectorAll("[data-nav]")) {
    const current = (link.dataset.nav === "log") === (path === "/log");
    if (current) link.setAttribute("aria-current", "page"); else link.removeAttribute("aria-current");
  }
  if (path === "/log") return showLog(main);
  if (path === "/new") return showForm(main, params.get("copy"));
  const detail = /^\/i\/([0-9a-f-]{36})$/.exec(path);
  if (detail) return showDetail(main, detail[1]);
  return showList(main);
}

window.addEventListener("hashchange", () => {
  if (leaveGuard && !leaveGuard()) return;
  leaveGuard = undefined;
  route();
});
window.addEventListener("beforeunload", (e) => {
  if (leaveGuard && leaveGuard(true)) { e.preventDefault(); e.returnValue = ""; }
});

async function showList(main) {
  const state = { q: "", offset: 0, rows: [], total: 0 };
  const tbody = h("tbody");
  const moreBox = h("div", { class: "more" });
  const card = h("div", { class: "card" });
  const search = h("input", { class: "search", type: "search", placeholder: "Keresés számla sorszámára vagy vevőre", "aria-label": "Keresés" });

  fill(main, 
    h("div", { class: "head" },
      h("h1", {}, "Számlák"),
      h("span", { class: "sp" }),
      h("a", { class: "btn primary", href: "#/new" }, "Új számla")),
    h("div", { class: "toolbar" }, search),
    card,
  );

  async function load(reset) {
    if (reset) { state.offset = 0; state.rows = []; }
    const qs = new URLSearchParams({ limit: "50", offset: String(state.offset) });
    if (state.q) qs.set("q", state.q);
    try {
      const data = await api("/v1/invoices?" + qs);
      state.rows = state.rows.concat(data.invoices);
      state.total = data.total;
      draw();
    } catch (error) {
      fill(card, h("div", { class: "section" }, errorBanner(error)));

  function draw() {
    if (state.rows.length === 0) {
      fill(card, h("div", { class: "empty" },
        state.q
          ? h("p", {}, "Nincs a keresésnek megfelelő számla.")

      return;
    }
    fill(tbody, ...state.rows.map((inv) =>
      h("tr", { onclick: () => (location.hash = "#/i/" + inv.id), tabindex: "0", onkeydown: (e) => { if (e.key === "Enter") location.hash = "#/i/" + inv.id; } },
        h("td", { class: "c-no" }, h("span", { class: "inv-no num" }, inv.invoiceNumber), inv.type === "storno" ? [" ", h("span", { class: "chip plain" }, "sztornó")] : null),
        h("td", { class: "buyer-cell c-buyer" }, inv.buyer.name),
        h("td", { class: "num hide-s" }, huDate(inv.issueDate)),
        h("td", { class: "num hide-s" }, inv.paymentMethod === "transfer" ? huDate(inv.dueDate) : "–"),
        h("td", { class: "r num c-amt" }, money(inv.totalGross)),
        h("td", { class: "hide-s" }, navChip(inv.nav, true)),
        h("td", { class: "hide-s" }, emailChip(inv.email, inv.manualEmail)),
      )));
    const table = h("div", { class: "tablewrap" }, h("table", { class: "list" },
      h("thead", {}, h("tr", {},
        h("th", {}, "Számla sorszáma"), h("th", {}, "Vevő"), h("th", { class: "hide-s" }, "Számla kelte"),
        h("th", { class: "hide-s" }, "Fizetési határidő"), h("th", { class: "r" }, "Végösszeg"),
        h("th", { class: "hide-s" }, "NAV"), h("th", { class: "hide-s" }, "E-mail"))),
      tbody));
    fill(moreBox, h("button", { class: "btn small", type: "button", onclick: () => { state.offset += 50; load(false); } }, `További ${state.total - state.rows.length} betöltése`));
    fill(card, table, state.rows.length < state.total ? moreBox : null);
  }

  let searchTimer;
  search.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.q = search.value.trim(); load(true); }, 250);
  });
  await load(true);
}

    const buyer = { type: b.type, name: b.name.trim(), postcode: b.postcode.trim(), city: b.city.trim(), address: b.address.trim() };
    if (b.type === "company") buyer.taxNumber = b.taxNumber.trim();
    if (b.email.trim()) buyer.email = b.email.trim();
    const lines = form.lines.map((l) => {
      const line = { description: l.description.trim(), quantity: Number(l.quantity) || 0, unit: l.unit.trim(), unitPriceGross: Number(l.price) || 0, vatRate: me.seller.aam ? 0 : l.vatRate };
      if (!me.seller.aam && l.vatRate === 0) line.vatExemption = l.exemption === "TAM" ? { case: "TAM", reason: l.reason.trim() || undefined } : { case: l.exemption };
      return line;
    });
    const body = { reference: form.reference, buyer, lines, paymentMethod: form.paymentMethod, fulfilmentDate: form.fulfilmentDate,
      sendEmail: Boolean(form.sendEmail && me.email && buyer.email) };
    if (form.dueDate) body.dueDate = form.dueDate;
    if (form.note.trim()) body.note = form.note.trim();
    return body;
  }

  function takeErrors(error) {
    errors = {};
    topError = error;
    for (const d of error.details || []) {
      const path = d.path || "";
      const text = huMessage(path, d.message);
      if (/^lines\.\d+$/.test(path)) errors[path + ".description"] = text;
      errors[path] = errors[path] || text;
    }
    if (error.code === "TAXPAYER_INVALID") errors["buyer.taxNumber"] = describeError(error);
    if (error.code === "DATE_INVALID") errors.dueDate = describeError(error);
    drawAll();
    errorBox.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  async function doPreview(button) {
    button.disabled = true;
    try {
      const response = await api("/v1/invoices/preview", { method: "POST", body: payload(), raw: true });
      const url = pdfUrl(await response.blob());
      errors = {}; topError = undefined; drawAll();
      const choice = await ask({
        title: "Előnézet", wide: true,
        body: h("iframe", { class: "dlg-pdf", src: url, title: "A számla előnézete" }),
        buttons: [{ label: "Vissza a szerkesztéshez", value: "back" }, { label: "Kiállítás…", value: "issue", kind: "primary" }],
      });
      if (choice === "issue") confirmIssue();
    } catch (error) {
      takeErrors(error);
    } finally {
      button.disabled = false;
    }
  }

  async function confirmIssue() {
    const body = payload();
    const total = body.lines.reduce((s, l) => s + l.unitPriceGross * l.quantity, 0);
    const choice = await ask({
      title: "Számla kiállítása",
      body: [
        h("dl", { class: "facts" },
          h("dt", {}, "Vevő"), h("dd", {}, body.buyer.name || "–"),
          h("dt", {}, "Végösszeg"), h("dd", { class: "num" }, money(total)),
          h("dt", {}, "Tételek"), h("dd", {}, String(body.lines.length)),
          h("dt", {}, "E-mail"), h("dd", {}, body.sendEmail ? body.buyer.email : "nem küldjük el")),
        h("p", { class: "sub" }, me.environment === "production"
          ? "Ez valódi számla: sorszámot kap, és azonnal beküldjük a NAV-nak. Utána csak sztornó számlával érvényteleníthető."
          : "Tesztrendszer: a számla a NAV tesztrendszerébe kerül."),
      ],
      buttons: [{ label: "Mégse", value: "no" }, { label: "Kiállítás és beküldés", value: "yes", kind: "primary" }],
    });
    if (choice !== "yes") return;
    busy = true;
    drawSide();
    try {
      const result = await api("/v1/invoices", { method: "POST", body });
      dirty = false;
      leaveGuard = undefined;
      toast(result.alreadyIssued ? `Ezt már kiállítottuk: ${result.invoice.invoiceNumber}` : `Kiállítva: ${result.invoice.invoiceNumber}`);
      location.hash = "#/i/" + result.invoice.id;
    } catch (error) {
      busy = false;
      takeErrors(error);
    }
  }

  function drawSide() {
    const total = form.lines.reduce((s, l) => s + lineTotal(l), 0);
    const previewBtn = h("button", { class: "btn", type: "button", disabled: busy, onclick: (e) => doPreview(e.currentTarget) }, "Előnézet");
    const issueBtn = h("button", { class: "btn primary", type: "button", disabled: busy, onclick: confirmIssue }, busy ? "Kiállítás…" : "Kiállítás…");
    fill(sideBox, 
      h("div", { class: "sum-label" }, form.paymentMethod === "transfer" ? "Fizetendő" : "Végösszeg"),
      h("div", { class: "sum-total num" }, money(total)),
      me.seller.aam ? h("div", { class: "hint" }, "Alanyi adómentes, áfa nélkül") : null,
      h("div", { class: "sum-rows" },
        h("div", {}, h("span", {}, "Vevő"), h("span", {}, form.buyer.name || "–")),
        h("div", {}, h("span", {}, "Fizetés módja"), h("span", {}, PAYMENT_LABELS[form.paymentMethod])),
        form.paymentMethod === "transfer" ? h("div", {}, h("span", {}, "Fizetési határidő"), h("span", { class: "num" }, huDate(form.dueDate))) : null),
      h("div", { class: "stack" }, previewBtn, issueBtn),
      h("p", { class: "hint" }, "Az előnézet nem számla: nem kap sorszámot, és nem kerül a NAV-hoz."),
    );
  }

  function drawAll() {
    fill(errorBox, topError ? errorBanner(topError) : "");
    drawBuyer(); drawLines(); drawPayment(); drawSide();
  }

  fill(main, 
    h("div", { class: "head" }, h("h1", {}, copyId ? "Új számla másolatból" : "Új számla"), h("span", { class: "sp" }), h("a", { class: "btn ghost", href: "#/" }, "Mégse")),
    errorBox,
    h("div", { class: "formgrid" },
      h("div", { class: "card" },
        h("div", { class: "section" }, buyerBox),
        h("div", { class: "section" }, linesBox),
        h("div", { class: "section" }, paymentBox)),
      h("div", { class: "side" }, sideBox)),
  );
  drawAll();
  if (!copyId) document.getElementById(form.buyer.type === "company" ? "b-tax" : "b-name")?.focus();
}

/* ---------- activity log ---------- */

const ACTIONS = {
  "login": ["Belépés", ""],
  "login refused": ["Elutasított belépés", "err"],
  "invoice issued": ["Számla kiállítva", "ok"],
  "storno issued": ["Sztornó kiállítva", "warn"],
  "issue refused": ["Sikertelen kiállítás", "err"],
  "email resent": ["E-mail újraküldve", ""],
  "email sent manually": ["Kézzel elküldve", "ok"],
  "email sent": ["E-mail elküldve", "ok"],
  "email failed": ["E-mail sikertelen", "err"],
  "email bounced": ["E-mail visszapattant", "err"],
  "nav sent": ["Beküldve a NAV-nak", ""],
  "nav send failed": ["NAV-beküldés sikertelen", "err"],
  "nav accepted": ["NAV befogadta", "ok"],
  "nav accepted with warnings": ["NAV figyelmeztetéssel fogadta be", "warn"],
  "nav rejected": ["NAV elutasította", "err"],
  "inspection export": ["Export adóellenőrzéshez", ""],
};
const actionLabel = (a) => (ACTIONS[a] || [a])[0];
const actionKind = (a) => (ACTIONS[a] || ["", ""])[1];
function actorLabel(actor) {
  if (!actor) return "–";
  if (actor === "system") return "Rendszer";
  if (actor === "cli") return "Parancssor";
  if (actor.startsWith("ui:")) return actor.slice(3);
  return "API: " + actor;
}
function browserOf(ua) {
  if (!ua) return undefined;
  const browser = /Edg\//.test(ua) ? "Edge" : /Firefox\//.test(ua) ? "Firefox" : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "böngésző";
  const os = /iPhone|iPad/.test(ua) ? "iOS" : /Android/.test(ua) ? "Android" : /Mac OS X/.test(ua) ? "macOS" : /Windows/.test(ua) ? "Windows" : /Linux/.test(ua) ? "Linux" : "";
  return os ? `${browser}, ${os}` : browser;
}
const OUTCOMES = { failed: "sikertelen", waiting: "várakozik", "no mailer": "nincs beállítva e-mail-küldés", "no recipient": "nincs címzett", done: "kész" };
const VIA = { web: "webes felület", api: "API", cli: "parancssor" };
const TEMPLATES = { "invoice-normal": "számla", "invoice-storno": "sztornó számla" };
/** One line of what an entry says, built from its details as text. */
function detailText(entry) {
  const d = entry.details || {};
  const parts = [];
  if (d.invoiceNumber && entry.action !== "invoice issued" && entry.action !== "storno issued") parts.push(d.invoiceNumber);
  if (d.buyer) parts.push(d.buyer);
  if (typeof d.totalGross === "number") parts.push(money(d.totalGross));
  if (d.reverses) parts.push(`érvényteleníti: ${d.reverses}`);
  if (d.to) parts.push(`címzett: ${d.to}`);
  if (d.template && TEMPLATES[d.template]) parts.push(TEMPLATES[d.template]);
  if (d.copy) parts.push("másolat");
  if (d.emailTo && entry.action === "invoice issued") parts.push(`e-mail: ${d.emailTo}`);
  if (d.transactionId) parts.push(`tranzakcióazonosító: ${d.transactionId}`);
  if (d.attempt && d.attempt > 1) parts.push(`${d.attempt}. próbálkozás`);
  if (d.code) parts.push(d.code);
  if (d.message) parts.push(d.message);
  if (d.messages) parts.push(d.messages);
  if (d.error) parts.push(d.error);
  if (d.reason) parts.push(d.reason);
  if (d.note) parts.push(`megjegyzés: ${d.note}`);
  if (d.selection) parts.push(Object.values(d.selection).join(" – ") + (typeof d.count === "number" ? `, ${d.count} számla` : ""));
  if (d.outcome && d.outcome !== "sent") parts.push(OUTCOMES[d.outcome] || d.outcome);
  if (d.via) parts.push(VIA[d.via] || d.via);
  const ua = browserOf(d.userAgent);
  if (ua) parts.push(ua);
  if (d.ip && d.ip !== "unknown") parts.push(d.ip + (d.country ? ` (${d.country})` : ""));
  else if (d.country) parts.push(d.country);
  if (d.expiresAt && entry.action === "login") parts.push(`érvényes: ${huDateTime(d.expiresAt)}`);
  return parts.join(" · ");
}

async function showLog(main) {
  const state = { actor: "", action: "", from: "", to: "", offset: 0, rows: [], total: 0, actors: [], actions: [] };
  const card = h("div", { class: "card" });
  const filters = h("div", { class: "filters" });

  fill(main,
    h("div", { class: "head" }, h("h1", {}, "Napló"), h("span", { class: "sp" }),
      h("span", { class: "sub" }, "Belépések, kiállított számlák, NAV-beküldések és e-mailek. A bejegyzések nem módosíthatók és nem törölhetők.")),
    filters,
    card);

  function drawFilters() {
    const select = (id, label, value, options, onChange) => h("div", { class: "f" },
      h("label", { for: id }, label),
      h("select", { id, onchange: (e) => onChange(e.target.value) },
        h("option", { value: "" }, "Összes"),
        options.map(([v, t]) => h("option", { value: v, selected: v === value }, t))));
    const date = (id, label, value, onChange) => h("div", { class: "f" },
      h("label", { for: id }, label), h("input", { id, type: "date", value, onchange: (e) => onChange(e.target.value) }));
    fill(filters,
      select("lf-actor", "Felhasználó", state.actor, state.actors.map((a) => [a, actorLabel(a)]), (v) => { state.actor = v; load(true); }),
      select("lf-action", "Esemény", state.action, state.actions.map((a) => [a, actionLabel(a)]), (v) => { state.action = v; load(true); }),
      date("lf-from", "Kezdő dátum", state.from, (v) => { state.from = v; load(true); }),
      date("lf-to", "Záró dátum", state.to, (v) => { state.to = v; load(true); }));
  }

  async function load(reset) {
    if (reset) { state.offset = 0; state.rows = []; }
    const qs = new URLSearchParams({ limit: "100", offset: String(state.offset) });
    for (const key of ["actor", "action", "from", "to"]) if (state[key]) qs.set(key, state[key]);
    try {
      const data = await api("/v1/audit?" + qs);
      state.rows = state.rows.concat(data.entries);
      state.total = data.total;
      state.actors = data.actors;
      state.actions = data.actions;
      drawFilters();
      draw();
    } catch (error) {
      fill(card, h("div", { class: "section" }, errorBanner(error)));
    }
  }

  function draw() {
    if (!state.rows.length) {
      fill(card, h("div", { class: "empty" }, h("p", {}, "Nincs a szűrésnek megfelelő bejegyzés.")));
      return;
    }
    const rows = state.rows.map((entry) => h("tr", {},
      h("td", { class: "when" }, huDateTime(entry.at)),
      h("td", { class: "who-cell" }, actorLabel(entry.actor)),
      h("td", { class: "what " + actionKind(entry.action) }, actionLabel(entry.action)),
      h("td", {}, entry.invoiceNumber ? h("a", { href: "#/i/" + entry.entityId, class: "num" }, entry.invoiceNumber) : "–"),
      h("td", { class: "det" }, detailText(entry))));
    fill(card,
      h("div", { class: "tablewrap" }, h("table", { class: "log" },
        h("thead", {}, h("tr", {}, h("th", {}, "Időpont"), h("th", {}, "Felhasználó"), h("th", {}, "Esemény"), h("th", {}, "Számla sorszáma"), h("th", {}, "Részletek"))),
        h("tbody", {}, rows))),
      state.rows.length < state.total
        ? h("div", { class: "more" }, h("button", { class: "btn small", type: "button", onclick: () => { state.offset += 100; load(false); } }, `További ${state.total - state.rows.length} betöltése`))
        : null);
  }

  drawFilters();
  await load(true);
}

            invoice.paymentMethod === "transfer" ? [h("dt", {}, "Fizetési határidő"), h("dd", { class: "num" }, huDate(invoice.dueDate))] : null,
            h("dt", {}, "Kiállította"), h("dd", {}, String(invoice.createdBy || "").replace(/^ui:/, "")))),
        statusCard,
        actionsCard,
        historyCard)),
  );
  drawStatus();
  drawActions();
  loadHistory();
  if (!settled(invoice)) pollTimer = setTimeout(refresh, 3000);
}

/* ---------- start ---------- */

(async function start() {
  try {
    me = await api("/v1/me");
  } catch (error) {
    document.getElementById("main").replaceChildren(errorBanner(error));
    return;
  }
  document.getElementById("seller-name").textContent = me.seller.name;
  document.getElementById("who").textContent = me.actor.replace(/^ui:/, "");
  document.getElementById("env-badge").hidden = me.environment === "production";
  document.title = `Számlák · ${me.seller.name}`;
  route();
})();
</script>
</body>
</html>
